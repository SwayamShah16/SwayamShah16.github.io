<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pac‑Man — Swayam Shah</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Pac‑Man — Play in your browser</h1>
    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="pauseBtn">Pause</button>
      <button id="restartBtn">Restart</button>
      <div class="score">Score: <span id="score">0</span></div>
      <div class="legend">Use arrow keys to move</div>
    </div>
    <canvas id="game" width="448" height="496" aria-label="Pacman game"></canvas>
    <p class="credits">Built for GitHub profile — simple Pac‑Man clone (no external libs).</p>
  </main>
  <script src="pacman.js"></script>
</body>
</html>
